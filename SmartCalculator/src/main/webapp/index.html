<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator">
        <div class="display">
            <input type="text" id="screen" readonly placeholder="0">
        </div>
        <div class="buttons">
            <!-- Row 1 -->
            <button type="button" class="btn operator">C</button>
            <button type="button" class="btn operator">&radic;</button>
            <button type="button" class="btn operator">%</button>
            <button type="button" class="btn operator">/</button>
            <!-- Row 2 -->
            <button type="button" class="btn">7</button>
            <button type="button" class="btn">8</button>
            <button type="button" class="btn">9</button>
            <button type="button" class="btn operator">*</button>
            <!-- Row 3 -->
            <button type="button" class="btn">4</button>
            <button type="button" class="btn">5</button>
            <button type="button" class="btn">6</button>
            <button type="button" class="btn operator">-</button>
            <!-- Row 4 -->
            <button type="button" class="btn">1</button>
            <button type="button" class="btn">2</button>
            <button type="button" class="btn">3</button>
            <button type="button" class="btn operator">+</button>
            <!-- Row 5 -->
            <button type="button" class="btn zero">0</button>
            <button type="button" class="btn">.</button>
            <button type="button" class="btn equals">=</button>
        </div>
    </main>
</body>
</html>
